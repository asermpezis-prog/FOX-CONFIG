          card_mod:
            style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(244,67,54,0.25);\n  background: rgba(244,67,54,0.07);\n  box-shadow: none;\n}"
        - type: custom:mushroom-template-card
