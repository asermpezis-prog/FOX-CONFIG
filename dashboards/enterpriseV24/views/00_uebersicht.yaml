title: Übersicht
path: uebersicht
icon: mdi:view-dashboard-variant
type: sections
max_columns: 3
dense_section_placement: false
header:
  layout: responsive
  card:
    type: vertical-stack
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
        - type: entities
          title: Steckdosen
          state_color: true
          show_header_toggle: false
          entities:
            - entity: switch.smart_switch_23080457178050510d0448e1e9d4dbcd_outlet
              name: "Merros 1 – Desktop (Büro)"
              icon: mdi:desktop-tower-monitor
            - entity: switch.bad_merros_bad_outlet
              name: "Merros 2 – Technikraum"
              icon: mdi:power-socket-eu
            - entity: switch.merros_waschmaschine_outlet
              name: "Merros 3 – Waschmaschine (Technikraum)"
              icon: mdi:washing-machine
            - entity: switch.0xa4c13808410affff
              name: "HAOS (NUC6)"
              icon: mdi:server
            - entity: switch.0xa4c138088db5ffff
              name: "Kühlschrank"
              icon: mdi:fridge-outline
            - entity: switch.0xa4c1380f7434ffff
              name: "Buero-Steckdose (Hobbyraum)"
              icon: mdi:power-socket-eu
          card_mod:
            style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(0,150,136,0.26);\n  background: rgba(0,150,136,0.08);\n  box-shadow: none;\n}"
        - type: entities
          title: Entfeuchter
          state_color: true
          show_header_toggle: false
          entities:
            - entity: switch.merros_entfeuchter_outlet
              name: "Merros 4 – Hobbyraum"
              icon: mdi:air-humidifier
            - entity: switch.schlafzimmer_merros_schlafzimmer_outlet
              name: "Merros 5 – Technikraum"
              icon: mdi:air-humidifier
          card_mod:
            style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(0,150,136,0.26);\n  background: rgba(0,150,136,0.08);\n  box-shadow: none;\n}"

sections:
- type: grid
  title: 🏠 Haus-Status
  cards:
  - type: custom:mushroom-template-card
    primary: Höchste Feuchtigkeit
    secondary: "{% set daten = [\n  ('Technikraum', states('sensor.0xf044d3fffef6dcf0_humidity')),\n  ('Büro', states('sensor.0x983268fffe9b883c_humidity')),\n\
      \  ('Hobbyraum', states('sensor.0xe456acfffe5bf40e_humidity')),\n  ('Schlafzimmer', states('sensor.0xa4c1380ac39bffff_humidity')),\n\
      \  ('Bad', states('sensor.0xa4c1380ab990ffff_humidity')),\n  ('Stavros', states('sensor.stavros_klima_humidity')),\n\
      \  ('Nikolas', states('sensor.0xa4c1380f4bc2ffff_humidity'))\n] %}\n{% set ns = namespace(raum='–', wert=-1) %}\n{%\
      \ for raum, wert in daten %}\n  {% if wert not in ['unknown','unavailable','none',''] and wert|float(-1) > ns.wert %}\n\
      \    {% set ns.raum = raum %}\n    {% set ns.wert = wert|float %}\n  {% endif %}\n{% endfor %}\n{{ ns.wert|round(1)\
      \ }} % · {{ ns.raum }}"
    icon: mdi:water-percent
    multiline_secondary: true
    fill_container: true
    icon_color: "{% set werte = [\n  states('sensor.0xf044d3fffef6dcf0_humidity'),\n  states('sensor.0x983268fffe9b883c_humidity'),\n\
      \  states('sensor.0xe456acfffe5bf40e_humidity'),\n  states('sensor.0xa4c1380ac39bffff_humidity'),\n  states('sensor.0xa4c1380ab990ffff_humidity'),\n\
      \  states('sensor.stavros_klima_humidity'),\n  states('sensor.0xa4c1380f4bc2ffff_humidity')\n] | reject('in', ['unknown','unavailable','none',''])\
      \ | map('float') | list %}\n{% set m = werte|max if werte else 0 %}\n{% if m >= 65 %} red\n{% elif m >= 60 %} orange\n\
      {% else %} green\n{% endif %}"
    card_mod:
      style: "ha-card {\n  background: rgba(33,150,243,0.10);\n  border: 1px solid rgba(33,150,243,0.28);\n  border-radius:\
        \ 16px;\n  box-shadow: none;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\nha-card:hover {\n  transform:\
        \ translateY(-1px);\n  box-shadow: 0 3px 10px rgba(0,0,0,0.10);\n}"
  - type: custom:mushroom-template-card
    primary: Aktive Entfeuchter
    secondary: "{% set ns = namespace(anzahl=0, namen=[]) %}\n{% for name, ent in [\n  ('Hobbyraum','switch.merros_entfeuchter_outlet'),\n\
      \  ('Technikraum','switch.schlafzimmer_merros_schlafzimmer_outlet')\n] %}\n\
      \  {% if is_state(ent,'on') %}\n    {% set ns.anzahl = ns.anzahl + 1 %}\n    {% set ns.namen = ns.namen + [name] %}\n\
      \  {% endif %}\n{% endfor %}\n{{ ns.anzahl }} aktiv{% if ns.namen %} · {{ ns.namen|join(', ') }}{% endif %}"
    icon: mdi:air-humidifier
    multiline_secondary: true
    fill_container: true
    icon_color: blue
    card_mod:
      style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.35);\n  background:\n    {% if is_state('switch.merros_entfeuchter_outlet','on')\n\
        \       or is_state('switch.schlafzimmer_merros_schlafzimmer_outlet','on')\
        \ %}\n      rgba(33,150,243,0.20)\n    {% else %}\n      rgba(33,150,243,0.06)\n    {% endif %};\n}"
  - type: custom:mushroom-template-card
    primary: Meross-Steckdosen
    secondary: "{% set l = ['switch.merros_entfeuchter_outlet','switch.schlafzimmer_merros_schlafzimmer_outlet','switch.bad_merros_bad_outlet','switch.merros_waschmaschine_outlet','switch.smart_switch_23080457178050510d0448e1e9d4dbcd_outlet','switch.smart_switch_23072012310265510d0a48e1e9d22d3a_outlet'] %}{% set n = l | select('is_state','unavailable') | list | length %}{% if n == 0 %}Alle erreichbar{% else %}{{ n }} von {{ l|length }} nicht erreichbar{% endif %}"
    icon: mdi:wifi-off
    multiline_secondary: true
    fill_container: true
    icon_color: "{% set l = ['switch.merros_entfeuchter_outlet','switch.schlafzimmer_merros_schlafzimmer_outlet','switch.bad_merros_bad_outlet','switch.merros_waschmaschine_outlet','switch.smart_switch_23080457178050510d0448e1e9d4dbcd_outlet','switch.smart_switch_23072012310265510d0a48e1e9d22d3a_outlet'] %}{{ 'red' if (l | select('is_state','unavailable') | list | length) > 0 else 'green' }}"
    card_mod:
      style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.35);\n  background: rgba(33,150,243,0.08);\n  box-shadow: none;\n}"
  - type: custom:mushroom-template-card
    primary: Alarmstatus
    secondary: '{% if is_state(''binary_sensor.0x0015bc0031064e35_smoke'',''on'') %}

      Rauchalarm Technikraum

      {% elif is_state(''binary_sensor.0xf044d3fffe1c34ba_water_leak'',''on'') %}

      Wasserwarnung Büro

      {% else %}

      Alles in Ordnung

      {% endif %}'
    icon: mdi:shield-home
    multiline_secondary: true
    fill_container: true
    icon_color: "{% if is_state('binary_sensor.0x0015bc0031064e35_smoke','on')\n   or is_state('binary_sensor.0xf044d3fffe1c34ba_water_leak','on')\
      \ %}\nred\n{% else %}\ngreen\n{% endif %}"
    card_mod:
      style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(76,175,80,0.35);\n  background:\n    {% if is_state('binary_sensor.0x0015bc0031064e35_smoke','on')\n\
        \       or is_state('binary_sensor.0xf044d3fffe1c34ba_water_leak','on') %}\n      rgba(244,67,54,0.22)\n    {% else\
        \ %}\n      rgba(76,175,80,0.10)\n    {% endif %};\n}"
  column_span: 3
- type: grid
  column_span: 3
  cards:
  - type: custom:expander-card
    title: "⚡ Energie & PV"
    expanded: false
    grid_options:
      columns: 24
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Balkonkraftwerk
            secondary: "{{ states('sensor.smart_switch_23072012310265510d0a48e1e9d22d3a_power')|float(0)|round(0) }} W jetzt\nHeute: {{ states('sensor.pv_erzeugung_heute')|float(0)|round(2) }} kWh"
            icon: mdi:solar-power-variant
            multiline_secondary: true
            fill_container: true
            icon_color: amber
            tap_action:
              action: navigate
              navigation_path: /dashboard-energie-pv
            card_mod:
              style: "ha-card {\n  background: rgba(255,193,7,0.10);\n  border: 1px solid rgba(255,193,7,0.32);\n  border-radius: 16px;\n  box-shadow: none;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\nha-card:hover {\n  transform: translateY(-1px);\n  box-shadow: 0 3px 10px rgba(0,0,0,0.10);\n}"
          - type: custom:mushroom-template-card
            primary: Hausverbrauch
            secondary: "{{ states('sensor.hausverbrauch_leistung')|float(0)|round(0) }} W jetzt\nHeute: {{ states('sensor.hausverbrauch_heute')|float(0)|round(1) }} kWh"
            icon: mdi:home-lightning-bolt
            multiline_secondary: true
            fill_container: true
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /dashboard-energie-pv
            card_mod:
              style: "ha-card {\n  background: rgba(255,193,7,0.10);\n  border: 1px solid rgba(255,193,7,0.32);\n  border-radius: 16px;\n  box-shadow: none;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\nha-card:hover {\n  transform: translateY(-1px);\n  box-shadow: 0 3px 10px rgba(0,0,0,0.10);\n}"
          - type: custom:mushroom-template-card
            primary: Netzbezug heute
            secondary: "{{ states('sensor.netz_bezug_tag')|float(0)|round(2) }} kWh\nKosten: {{ states('sensor.stromkosten_heute')|float(0)|round(2) }} €"
            icon: mdi:transmission-tower
            multiline_secondary: true
            fill_container: true
            icon_color: red
            tap_action:
              action: navigate
              navigation_path: /dashboard-energie-pv
            card_mod:
              style: "ha-card {\n  background: rgba(255,193,7,0.10);\n  border: 1px solid rgba(255,193,7,0.32);\n  border-radius: 16px;\n  box-shadow: none;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\nha-card:hover {\n  transform: translateY(-1px);\n  box-shadow: 0 3px 10px rgba(0,0,0,0.10);\n}"
          - type: custom:mushroom-template-card
            primary: Autarkie heute
            secondary: "{{ states('sensor.autarkiegrad_heute')|float(0)|round(0) }} %\nPV-Ersparnis: {{ states('sensor.pv_ersparnis_heute')|float(0)|round(2) }} €"
            icon: mdi:leaf
            multiline_secondary: true
            fill_container: true
            icon_color: green
            tap_action:
              action: navigate
              navigation_path: /dashboard-energie-pv
            card_mod:
              style: "ha-card {\n  background: rgba(255,193,7,0.10);\n  border: 1px solid rgba(255,193,7,0.32);\n  border-radius: 16px;\n  box-shadow: none;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\nha-card:hover {\n  transform: translateY(-1px);\n  box-shadow: 0 3px 10px rgba(0,0,0,0.10);\n}"
          - type: custom:mushroom-template-card
            primary: Grundlast
            secondary: "{% set g = states('sensor.grundlast') | float(0) %}{{ g | round(0) | int }} W · {{ '%.1f' | format(g * 24 / 1000) | replace('.', ',') }} kWh/Tag\n≈ {{ (g * 8.76 * states('input_number.strompreis_cent') | float(31) / 100) | round(0) | int }} € im Jahr"
            icon: mdi:power-sleep
            multiline_secondary: true
            fill_container: true
            icon_color: "{{ 'green' if states('sensor.grundlast') | float(0) < 150 else ('amber' if states('sensor.grundlast') | float(0) < 300 else 'red') }}"
            tap_action:
              action: navigate
              navigation_path: /dashboard-energie-pv/stromzaehler
            card_mod:
              style: "ha-card {\n  background: rgba(255,193,7,0.10);\n  border: 1px solid rgba(255,193,7,0.32);\n  border-radius: 16px;\n  box-shadow: none;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\nha-card:hover {\n  transform: translateY(-1px);\n  box-shadow: 0 3px 10px rgba(0,0,0,0.10);\n}"
          - type: custom:mushroom-template-card
            primary: Phasen jetzt
            secondary: "L1 {{ states('sensor.bitshake_smartmeterreader_lk13be_power_l1') | float(0) | round(0) | int }} W · L2 {{ states('sensor.bitshake_smartmeterreader_lk13be_power_l2') | float(0) | round(0) | int }} W\nL3 {{ states('sensor.bitshake_smartmeterreader_lk13be_power_l3') | float(0) | round(0) | int }} W"
            icon: mdi:sine-wave
            multiline_secondary: true
            fill_container: true
            icon_color: "{{ 'red' if [states('sensor.bitshake_smartmeterreader_lk13be_curr_l1') | float(0), states('sensor.bitshake_smartmeterreader_lk13be_curr_l2') | float(0), states('sensor.bitshake_smartmeterreader_lk13be_curr_l3') | float(0)] | max > 13 else 'indigo' }}"
            tap_action:
              action: navigate
              navigation_path: /dashboard-energie-pv/stromzaehler
            card_mod:
              style: "ha-card {\n  background: rgba(255,193,7,0.10);\n  border: 1px solid rgba(255,193,7,0.32);\n  border-radius: 16px;\n  box-shadow: none;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\nha-card:hover {\n  transform: translateY(-1px);\n  box-shadow: 0 3px 10px rgba(0,0,0,0.10);\n}"
