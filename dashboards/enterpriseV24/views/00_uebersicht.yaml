          icon: mdi:cctv
          icon_color: "{% set pe = is_state('binary_sensor.parking_person','on') %}{% set o0 = is_state('binary_sensor.parking_fahrzeug','on') %}{% set o1 = is_state('binary_sensor.parking_tier','on') %}{% set be = is_state('binary_sensor.parking_bewegung','on') %}{{ 'red' if (pe or o0 or o1) else ('orange' if be else 'green') }}"
          multiline_secondary: true
          tap_action:
            action: navigate
            navigation_path: /dashboard-enterprisev24/kameras
          card_mod:
