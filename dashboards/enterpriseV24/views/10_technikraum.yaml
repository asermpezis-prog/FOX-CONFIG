title: Technikraum
path: technikraum
icon: mdi:server
type: masonry
cards:
- type: markdown
  content: '## Technikraum'
  card_mod:
    style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.28);\n  background: rgba(33,150,243,0.08);\n\
      \  box-shadow: none;\n}"
- type: entities
  title: Klima
  show_header_toggle: false
  entities:
  - entity: sensor.0xf044d3fffef6dcf0_temperature
    name: Temperatur
  - entity: sensor.0xf044d3fffef6dcf0_humidity
    name: Luftfeuchtigkeit
  - entity: sensor.0xf044d3fffef6dcf0_battery
    name: Batterie
  card_mod:
    style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.28);\n  background: rgba(33,150,243,0.08);\n\
      \  box-shadow: none;\n}"
- type: custom:apexcharts-card
  header:
    show: true
    title: Technikraum – 48 Stunden
    show_states: true
    colorize_states: true
  graph_span: 48h
  update_interval: 5min
  now:
    show: true
    label: Jetzt
  yaxis:
  - id: humidity
    min: 35
    max: 75
    decimals: 1
    apex_config:
      title:
        text: Feuchtigkeit (%)
  - id: temperature
    opposite: true
    min: 10
    max: 35
    decimals: 1
    apex_config:
      title:
        text: Temperatur (°C)
  - id: dehumidifier
    opposite: true
    min: 0
    max: 1
    decimals: 0
    show: false
  series:
  - entity: sensor.0xf044d3fffef6dcf0_humidity
    name: Luftfeuchtigkeit
    yaxis_id: humidity
    type: line
    stroke_width: 3
    extend_to: now
    group_by:
      duration: 10min
      func: avg
    show:
      in_header: raw
      legend_value: false
  - entity: sensor.0xf044d3fffef6dcf0_temperature
    name: Temperatur
    yaxis_id: temperature
    type: line
    stroke_width: 2
    extend_to: now
    group_by:
      duration: 10min
      func: avg
    show:
      in_header: raw
      legend_value: false
  - entity: switch.schlafzimmer_merros_schlafzimmer_outlet
    name: Entfeuchter läuft
    yaxis_id: dehumidifier
    type: area
    curve: stepline
    stroke_width: 2
    opacity: 0.25
    extend_to: now
    transform: 'return x === ''on'' ? 1 : 0;'
    show:
      in_header: false
      legend_value: false
  apex_config:
    chart:
      height: 360
      toolbar:
        show: true
    legend:
      show: true
      position: top
    tooltip:
      shared: true
      intersect: false
    annotations:
      yaxis:
      - y: 50
        borderColor: green
        strokeDashArray: 5
        label:
          borderColor: green
          text: Ziel 50 %
      - y: 60
        borderColor: orange
        strokeDashArray: 5
        label:
          borderColor: orange
          text: Hoch 60 %
      - y: 65
        borderColor: red
        strokeDashArray: 5
        label:
          borderColor: red
          text: Kritisch 65 %
  card_mod:
    style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.28);\n  background: rgba(33,150,243,0.08);\n\
      \  box-shadow: none;\n}"
- type: entities
  title: Entfeuchter
  show_header_toggle: false
  entities:
  - entity: switch.schlafzimmer_merros_schlafzimmer_outlet
    name: Entfeuchter
  - entity: sensor.0xf044d3fffef6dcf0_humidity
    name: Aktuelle Feuchtigkeit
  card_mod:
    style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.28);\n  background: rgba(33,150,243,0.08);\n\
      \  box-shadow: none;\n}"
- type: entities
  title: Weitere Geräte
  show_header_toggle: false
  entities:
  - entity: binary_sensor.0x0015bc0031064e35_smoke
    name: Rauch erkannt
  - entity: switch.0x0015bc0031064e35_alarm
    name: Sirene
  - entity: sensor.0x0015bc0031064e35_temperature
    name: Temperatur Rauchmelder
  - entity: sensor.0x0015bc0031064e35_battery
    name: Batterie Rauchmelder
  card_mod:
    style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.28);\n  background: rgba(33,150,243,0.08);\n\
      \  box-shadow: none;\n}"
- type: picture-entity
  title: Tapo C310 Livebild
  entity: camera.tapo_c310_mainstream
  camera_view: live
  aspect_ratio: '16:9'
  show_name: true
  show_state: false
  card_mod:
    style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.28);\n  background: rgba(33,150,243,0.08);\n\
      \  box-shadow: none;\n}"
- type: entities
  title: 🖥️ HAOS / NUC6
  show_header_toggle: false
  entities:
  - entity: switch.0xa4c13808410affff
    name: HAOS Steckdose
    icon: mdi:server
  card_mod:
    style: "ha-card {\n  border-radius: 16px;\n  border: 1px solid rgba(33,150,243,0.28);\n  background: rgba(33,150,243,0.08);\n\
      \  box-shadow: none;\n}"
